name: F1 Paddock Quiz — Answer Comments

on:
  schedule:
    # Every hour at :05 UTC — offset from post crons (:00) to avoid schedule collisions
    - cron: '5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1paddockquiz-comments-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run-comments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore question database cache
        uses: actions/cache@v4
        with:
          path: database.db
          key: quiz-db-${{ github.ref_name }}
          save-always: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post Scheduled Answer Comments
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python main.py --post-comments

      - name: Commit updated comment status to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add pending_comments.json database.db || true
          git diff --staged --quiet || git commit -m "ci: update comment status"
          git push || (git pull --rebase && git push)
