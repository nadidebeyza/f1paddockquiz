name: F1 Paddock Quiz — Daily Post

on:
  schedule:
    # Post 1 — UTC 09:00 (Turkey 12:00)
    - cron: '0 9 * * *'
    # Post 2 — UTC 17:00 (Turkey 20:00)
    - cron: '0 17 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1paddockquiz-post-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore question database cache
        uses: actions/cache@v4
        with:
          path: database.db
          key: quiz-db-${{ github.ref_name }}
          save-always: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system fonts (fallback)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run Quiz Post Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          WATERMARK_TEXT: ${{ secrets.WATERMARK_TEXT }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          COMMENT_DELAY_HOURS: 3
        run: python main.py

      - name: Commit pending comments to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_comments.json database.db || true
          git diff --staged --quiet || git commit -m "ci: update pending comments after post"
          git push
